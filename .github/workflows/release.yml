name: Build and Release Zik APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Zik APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME=${GITHUB_REF_NAME:-v1.0.0}
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/zik-${TAG_NAME}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/zik-latest.apk
          cd release-artifacts
          sha256sum zik-${TAG_NAME}.apk > zik-${TAG_NAME}.apk.sha256
          sha256sum zik-latest.apk > zik-latest.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Zik ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/zik-*.apk
            release-artifacts/zik-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
